name: 功能建议
description: 提出一个新功能或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议。先说清**要解决什么问题**，比直接描述实现方式更有用 ——
        有时有更简单的做法。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 现在哪里不方便？什么场景下卡住了？
      placeholder: 我每次要…的时候都得…
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      description: 如果有想法就写，没有也没关系
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个建议与「Loomy 账号管理」相关（导入 / 切换 / 余额 / 任务 / 邀请码）
          required: true
        - label: 我理解本项目只做账号管理，不接受无关的自动化能力
          required: true
